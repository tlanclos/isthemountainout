name: Docker Image CI
on:
  push:
    branches: [ "latest" ]
  pull_request:
    branches: [ "latest" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build
      uses: docker/build-push-action@v6
      with:
        load: true
        push: true
        tags: tlanclos/isthemountainout:latest
    - name: Inspect
      run: |
        docker image inspect isthemountainout:latest
